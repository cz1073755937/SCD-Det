# Class-wise BSC example. The 0.005 weight was validation-selected for CODD;
# tune it on the validation split before applying it to another dataset.
task: detect
mode: train
model: models/scd_det_n.yaml
data: data/dataset.example.yaml
epochs: 300
patience: 300
batch: 32
imgsz: 640
workers: 8
project: runs/scd_det
name: multiclass_seed_0
pretrained: false
optimizer: SGD
seed: 0
deterministic: true
rect: false
cos_lr: false
close_mosaic: 0
amp: true
lr0: 0.01
lrf: 0.01
momentum: 0.937
weight_decay: 0.0005
scale: 0.0
mosaic: 0.0
lambda_cons: 0.005
bsc_classwise: true
bsc_mode: paper
bsc_huber_delta: 1.0
